ttps://luyiin.me" target="_blank" class="pl-1" rel="noreferrer">「 Luyiin</a><a href="https://github.com/ZiYi0414/handsome-css3-lib" target="_blank" class="pl-1" rel="noreferrer">© HANDSOME-CSS-LIB 」 🌸 <!-- -->2026</a></div></section></footer></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"posts":[{"title":"strange-goose-48","made_by":"eslam-hany","html":"\n\u003cdiv class=\"input-container\"\u003e\n  \u003cinput class=\"input\" name=\"text\" type=\"text\" /\u003e\n  \u003clabel class=\"label\" for=\"input\"\u003eEnter Your Name\u003c/label\u003e\n  \u003cdiv class=\"topline\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"underline\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.input-container {\n  position: relative;\n}\n\n.input {\n  padding: 10px;\n  height: 40px;\n  border: 2px solid #0b2447;\n  border-top: none;\n  border-bottom: none;\n  font-size: 16px;\n  background: transparent;\n  outline: none;\n  box-shadow: 7px 7px 0px 0px #0b2447;\n  transition: all 0.5s;\n}\n\n.input:focus {\n  box-shadow: none;\n  transition: all 0.5s;\n}\n\n.label {\n  position: absolute;\n  top: 10px;\n  left: 10px;\n  color: #0b2447;\n  transition: all 0.5s;\n  transform: scale(0);\n  z-index: -1;\n}\n\n.input-container .topline {\n  position: absolute;\n  content: '';\n  background-color: #0b2447;\n  width: 0%;\n  height: 2px;\n  right: 0;\n  top: 0;\n  transition: all 0.5s;\n}\n\n.input-container input[type='text']:focus ~ .topline {\n  width: 35%;\n  transition: all 0.5s;\n}\n\n.input-container .underline {\n  position: absolute;\n  content: '';\n  background-color: #0b2447;\n  width: 0%;\n  height: 2px;\n  right: 0;\n  bottom: 0;\n  transition: all 0.5s;\n}\n\n.input-container input[type='text']:focus ~ .underline {\n  width: 100%;\n  transition: all 0.5s;\n}\n\n.input-container input[type='text']:focus ~ .label {\n  top: -10px;\n  transform: scale(1);\n  transition: all 0.5s;\n}\n","type":"inputs","slug":"strange-goose-48"},{"title":"serious-lionfish-75","made_by":"Jaareet","theme":"dark","html":"\n\u003cinput type=\"text\" name=\"text\" class=\"input\" placeholder=\"Write a message\" /\u003e\n","css":"\n.input {\n  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto',\n    'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans',\n    'Helvetica Neue', sans-serif;\n  font-weight: 500;\n  font-size: 0.8vw;\n  color: #fff;\n  background-color: rgb(28, 28, 30);\n  box-shadow: 0 0 0.4vw rgba(0, 0, 0, 0.5), 0 0 0 0.15vw transparent;\n  border-radius: 0.4vw;\n  border: none;\n  outline: none;\n  padding: 0.4vw;\n  max-width: 190px;\n  transition: 0.4s;\n}\n\n.input:hover {\n  box-shadow: 0 0 0 0.15vw rgba(135, 207, 235, 0.186);\n}\n\n.input:focus {\n  box-shadow: 0 0 0 0.15vw skyblue;\n}\n","type":"inputs","slug":"serious-lionfish-75"},{"title":"selfish-parrot-52","made_by":"Mhyar-nsi","html":"\n\u003cinput type=\"text\" name=\"text\" class=\"input\" placeholder=\"Type here...\" /\u003e\n","css":"\n.input {\n  font-family: monospace;\n  max-width: 190px;\n  outline: none;\n  border: 1px solid #dadada;\n  padding: 10px;\n  border-radius: 5px;\n  background-color: #f3f7fe;\n  transition: 0.3s;\n  color: #3b82f6;\n}\n\n.input::placeholder {\n  color: #3b82f6;\n}\n\n.input:focus {\n  border: 1px solid #3b82f6;\n  box-shadow: 0 0 0 5px #3b83f65f;\n}\n","type":"inputs","slug":"selfish-parrot-52"},{"title":"plastic-bobcat-37","made_by":"satyamchaudharydev","html":"\n\u003cform class=\"form\"\u003e\n  \u003cbutton\u003e\n    \u003csvg\n      width=\"17\"\n      height=\"16\"\n      fill=\"none\"\n      xmlns=\"http://www.w3.org/2000/svg\"\n      role=\"img\"\n      aria-labelledby=\"search\"\n    \u003e\n      \u003cpath\n        d=\"M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9\"\n        stroke=\"currentColor\"\n        stroke-width=\"1.333\"\n        stroke-linecap=\"round\"\n        stroke-linejoin=\"round\"\n      \u003e\u003c/path\u003e\n    \u003c/svg\u003e\n  \u003c/button\u003e\n  \u003cinput class=\"input\" placeholder=\"Type your text\" required=\"\" type=\"text\" /\u003e\n  \u003cbutton class=\"reset\" type=\"reset\"\u003e\n    \u003csvg\n      xmlns=\"http://www.w3.org/2000/svg\"\n      class=\"h-6 w-6\"\n      fill=\"none\"\n      viewBox=\"0 0 24 24\"\n      stroke=\"currentColor\"\n      stroke-width=\"2\"\n    \u003e\n      \u003cpath\n        stroke-linecap=\"round\"\n        stroke-linejoin=\"round\"\n        d=\"M6 18L18 6M6 6l12 12\"\n      \u003e\u003c/path\u003e\n    \u003c/svg\u003e\n  \u003c/button\u003e\n\u003c/form\u003e\n","css":"\n/* From uiverse.io by @satyamchaudharydev */\n/* removing default style of button */\n\n.form button {\n  border: none;\n  background: none;\n  color: #8b8ba7;\n}\n/* styling of whole input container */\n.form {\n  --timing: 0.3s;\n  --width-of-input: 200px;\n  --height-of-input: 40px;\n  --border-height: 2px;\n  --input-bg: #fff;\n  --border-color: #2f2ee9;\n  --border-radius: 30px;\n  --after-border-radius: 1px;\n  position: relative;\n  width: var(--width-of-input);\n  height: var(--height-of-input);\n  display: flex;\n  align-items: center;\n  padding-inline: 0.8em;\n  border-radius: var(--border-radius);\n  transition: border-radius 0.5s ease;\n  background: var(--input-bg, #fff);\n}\n/* styling of Input */\n.input {\n  font-size: 0.9rem;\n  background-color: transparent;\n  width: 100%;\n  height: 100%;\n  padding-inline: 0.5em;\n  padding-block: 0.7em;\n  border: none;\n}\n/* styling of animated border */\n.form:before {\n  content: '';\n  position: absolute;\n  background: var(--border-color);\n  transform: scaleX(0);\n  transform-origin: center;\n  width: 100%;\n  height: var(--border-height);\n  left: 0;\n  bottom: 0;\n  border-radius: 1px;\n  transition: transform var(--timing) ease;\n}\n/* Hover on Input */\n.form:focus-within {\n  border-radius: var(--after-border-radius);\n}\n\ninput:focus {\n  outline: none;\n}\n/* here is code of animated border */\n.form:focus-within:before {\n  transform: scale(1);\n}\n/* styling of close button */\n/* == you can click the close button to remove text == */\n.reset {\n  border: none;\n  background: none;\n  opacity: 0;\n  visibility: hidden;\n}\n/* close button shown when typing */\ninput:not(:placeholder-shown) ~ .reset {\n  opacity: 1;\n  visibility: visible;\n}\n/* sizing svg icons */\n.form svg {\n  width: 17px;\n  margin-top: 3px;\n}\n","type":"inputs","slug":"plastic-bobcat-37"},{"title":"pink-bat-77","made_by":"Satwinder04","html":"\n\u003cdiv class=\"input-container\"\u003e\n  \u003cinput type=\"text\" id=\"input\" required=\"\" /\u003e\n  \u003clabel for=\"input\" class=\"label\"\u003eEnter Text\u003c/label\u003e\n  \u003cdiv class=\"underline\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.input-container {\n  position: relative;\n  margin: 50px auto;\n  width: 200px;\n}\n\n.input-container input[type='text'] {\n  font-size: 20px;\n  width: 100%;\n  border: none;\n  border-bottom: 2px solid #ccc;\n  padding: 5px 0;\n  background-color: transparent;\n  outline: none;\n}\n\n.input-container .label {\n  position: absolute;\n  top: 0;\n  left: 0;\n  color: #ccc;\n  transition: all 0.3s ease;\n  pointer-events: none;\n}\n\n.input-container input[type='text']:focus ~ .label,\n.input-container input[type='text']:valid ~ .label {\n  top: -20px;\n  font-size: 16px;\n  color: #333;\n}\n\n.input-container .underline {\n  position: absolute;\n  bottom: 0;\n  left: 0;\n  height: 2px;\n  width: 100%;\n  background-color: #333;\n  transform: scaleX(0);\n  transition: all 0.3s ease;\n}\n\n.input-container input[type='text']:focus ~ .underline,\n.input-container input[type='text']:valid ~ .underline {\n  transform: scaleX(1);\n}\n","type":"inputs","slug":"pink-bat-77"},{"title":"mean-stingray-9","made_by":"G4b413l","html":"\n\u003cdiv class=\"group\"\u003e\n  \u003cinput required=\"\" type=\"text\" class=\"input\" /\u003e\n  \u003cspan class=\"highlight\"\u003e\u003c/span\u00
