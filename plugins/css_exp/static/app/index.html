nt: vertical;\n  -webkit-box-direction: normal;\n  -ms-flex-direction: column;\n  flex-direction: column;\n  -webkit-box-pack: center;\n  -ms-flex-pack: center;\n  justify-content: center;\n  -webkit-box-align: center;\n  -ms-flex-align: center;\n  align-items: center;\n  width: 200px;\n  height: 200px;\n  color: rgb(131, 131, 131);\n  -webkit-transition: 400ms ease-in-out;\n  transition: 400ms ease-in-out;\n  transform: translateY(20px);\n}\n\n/* clickHandler, as the name suggests, handles clicks. \n\t Its a label for invisible checkbox, positioned absolutely and taking whole container space.\n\t Comes with insane z-index. Stays above .container\n\t When clicked, will change input state to checked */\n#shuttle-wrapper {\n  position: absolute;\n  opacity: 0;\n  -webkit-transition: 200ms ease-in;\n  transition: 200ms ease-in;\n  z-index: 200;\n}\n\n#b {\n  width: 80px;\n  height: auto;\n  z-index: 200;\n}\n\n#shadow {\n  position: absolute;\n  width: 100px;\n  height: 80px;\n  -webkit-transform: rotateX(45deg) rotateZ(45deg);\n  transform: rotateX(45deg) rotateZ(45deg);\n  bottom: -10px;\n  z-index: -1;\n  background: radial-gradient(rgba(0, 0, 0, 0.382) 0%, rgba(0, 0, 0, 0) 70%);\n}\n\n#clickHandler {\n  display: block;\n  position: absolute;\n  inset: 0;\n  z-index: 999;\n}\n\n#clickHandler:hover {\n  cursor: pointer;\n}\n\n.container:hover #shuttle-wrapper {\n  opacity: 1;\n  -webkit-transform: translateY(-100px) translateZ(140px);\n  -ms-transform: translateY(-100px) translateZ(140px);\n  transform: translateY(-100px) translateZ(140px);\n  -webkit-transition: 400ms ease-in-out;\n  transition: 400ms ease-in-out;\n}\n\n#checkbox {\n  /* comment out to actually see the checkbox state */\n  display: none;\n  /*  */\n  position: absolute;\n  bottom: 0px;\n  width: 200px;\n}\n\n/* this pseudo-selectors will fire animations when \n\t clickHandler changes checkbox state to checked */\n#checkbox:checked ~ #shuttle-wrapper #b {\n  -webkit-animation-name: launch;\n  animation-name: launch;\n  -webkit-animation-timing-function: ease-in-out;\n  animation-timing-function: ease-in-out;\n  -webkit-animation-duration: 6s;\n  animation-duration: 6s;\n}\n\n#checkbox:checked ~ #shuttle-wrapper #shadow {\n  -webkit-animation: shadow-launch 6s ease-in-out;\n  animation: shadow-launch 6s ease-in-out;\n}\n\n#checkbox:checked ~ #to-hover {\n  -webkit-animation-name: fadeout_010;\n  animation-name: fadeout_010;\n  -webkit-animation-duration: 6s;\n  animation-duration: 6s;\n}\n\n#checkbox:checked ~ #button #to-launch {\n  -webkit-animation-name: fadeout_010;\n  animation-name: fadeout_010;\n  -webkit-animation-duration: 6s;\n  animation-duration: 6s;\n}\n/* and this will take care of hover */\n#clickHandler:hover ~ #button {\n  width: 200px;\n  height: 200px;\n  -webkit-transform: translate3d(0px, -16px, 0px) rotateX(51deg) rotateZ(43deg);\n  transform: translate3d(0px, -16px, 0px) rotateX(51deg) rotateZ(43deg);\n  -webkit-box-shadow: 2px 2px 0 2px #b2b2b2, -1px 0 28px 0 rgba(255, 250, 225, 0.512),\n    28px 28px 28px 0 rgba(28, 27, 88, 0.315);\n  box-shadow: 2px 2px 0 2px #b2b2b2, -1px 0 28px 0 rgba(255, 250, 225, 0.512),\n    28px 28px 28px 0 rgba(28, 27, 88, 0.315);\n  -webkit-transition-delay: 0ms;\n  transition-delay: 0ms;\n}\n\n.container:hover {\n  -webkit-transform: translateY(30%);\n  -ms-transform: translateY(30%);\n  transform: translateY(30%);\n}\n\n#to-launch {\n  color: rgb(1, 85, 255);\n  font-size: large;\n  font-weight: bold;\n  -webkit-transition: ease-out 200ms;\n  transition: ease-out 200ms;\n}\n\n#to-hover {\n  margin-top: 1em;\n  text-align: center;\n  -webkit-transition: ease-out 200ms;\n  transition: ease-out 200ms;\n}\n\n#tag {\n  opacity: 0;\n  color: rgb(43, 43, 43);\n  position: absolute;\n}\n\n#platform {\n  position: absolute;\n  width: 70%;\n  height: 0;\n  border-radius: 16px;\n  background-color: rgb(234, 234, 234);\n  -webkit-transition: 0.3s ease-in-out;\n  transition: 0.3s ease-in-out;\n  -webkit-transition-delay: 150ms;\n  transition-delay: 150ms;\n  border: solid 0px rgba(42, 42, 42, 0);\n  outline: dashed rgba(255, 173, 57, 0);\n  -moz-outline-radius: 16px;\n  outline-width: 0px;\n  outline-offset: 0px;\n}\n\n#clickHandler:hover ~ #button #platform {\n  height: 70%;\n  background: rgb(244, 244, 244);\n  border: solid 4px rgb(42, 42, 42);\n  outline: dashed rgb(255, 172, 57);\n  outline-width: 4px;\n  outline-offset: -4px;\n  -webkit-animation: shake_010 80ms infinite;\n  animation: shake_010 80ms infinite;\n}\n\n.caution {\n  -webkit-transform: translateY(-200);\n  -ms-transform: translateY(-200);\n  transform: translateY(-200);\n  position: absolute;\n  width: 100%;\n  text-align: center;\n}\n\n#checkbox:checked ~ .caution {\n  -webkit-animation-name: fadeout_010;\n  animation-name: fadeout_010;\n  -webkit-animation-duration: 6s;\n  animation-duration: 6s;\n}\n\n#caution-left {\n  -webkit-transition: 200ms ease;\n  transition: 200ms ease;\n  opacity: 0;\n  -webkit-transform: translate3d(83px, 0px, 0px) rotateX(0deg) rotateY(0deg) rotateZ(\n      -90deg\n    );\n  transform: translate3d(83px, 0px, 0px) rotateX(0deg) rotateY(0deg) rotateZ(\n      -90deg\n    );\n}\n\n#caution-right {\n  -webkit-transition: 200ms ease;\n  transition: 200ms ease;\n  opacity: 0;\n  -webkit-transform: translate3d(0px, 62px, 0px) rotateX(0deg) rotateY(0deg) rotateZ(\n      0deg\n    );\n  transform: translate3d(0px, 62px, 0px) rotateX(0deg) rotateY(0deg) rotateZ(\n      0deg\n    );\n}\n\n#clickHandler:hover ~ #button .caution #caution-left {\n  opacity: 1;\n  -webkit-transition: 400ms ease-in;\n  transition: 400ms ease-in;\n  animation: glow_010 1.2s infinite;\n}\n\n#clickHandler:hover ~ #button .caution #caution-right {\n  opacity: 1;\n  -webkit-transition: 400ms ease-in;\n  transition: 400ms ease-in;\n  animation: glow_010 1.2s infinite;\n}\n\n#button {\n  width: 200px;\n  height: 80px;\n  border: none;\n  border-radius: 1.8rem;\n  -webkit-transition: 0.4s ease-in-out;\n  transition: 0.4s ease-in-out;\n  -webkit-box-shadow: 5px 5px 8px 0 rgba(28, 27, 88, 0.315);\n  box-shadow: 5px 5px 8px 0 rgba(28, 27, 88, 0.315);\n  background: -webkit-gradient(\n    linear,\n    left top,\n    right top,\n    from(#ffffff),\n    to(#ececec)\n  );\n  background: linear-gradient(125deg, #ffffff 50%, #f5f5ff);\n  display: -webkit-box;\n  display: -ms-flexbox;\n  display: flex;\n  -webkit-box-pack: center;\n  -ms-flex-pack: center;\n  justify-content: center;\n  -webkit-box-align: center;\n  -ms-flex-align: center;\n  align-items: center;\n  font-family: inherit;\n  -webkit-transition-delay: 100ms;\n  transition-delay: 100ms;\n}\n\n#clickHandler:hover ~ #button #to-launch {\n  opacity: 0;\n}\n\n#clickHandler:hover ~ #to-hover {\n  opacity: 0;\n}\n\n#checkbox:checked ~ #button #tag {\n  -webkit-animation: tag-transition 5s ease-in-out;\n  animation: tag-transition 5s ease-in-out;\n}\n\n/* launch sequence, takes only 20% of duration to completely fade out,\n\t and stays there til 90% */\n\n@keyframes launch {\n  5% {\n    opacity: 1;\n  }\n\n  15%,\n  90% {\n    -webkit-transform: translateY(-200px);\n    transform: translateY(-200px);\n    -webkit-transition-timing-function: ease-in;\n    transition-timing-function: ease-in;\n    opacity: 0;\n  }\n\n  100% {\n    opacity: 1;\n  }\n}\n\n@keyframes shadow-launch {\n  0% {\n    opacity: 1;\n  }\n\n  10%,\n  90% {\n    opacity: 0;\n  }\n\n  100% {\n    opacity: 1;\n  }\n}\n\n@keyframes fadeout_010 {\n  100% {\n    opacity: 1;\n  }\n\n  0%,\n  20%,\n  90% {\n    opacity: 0;\n  }\n}\n\n@keyframes shake_010 {\n  0%,\n  50% {\n    -webkit-transform: translate3d(1px, 0px, 0px);\n    transform: translate3d(1px, 0px, 0px);\n  }\n\n  100% {\n    -webkit-transform: translate3d(0px, 1px, 0px);\n    transform: translate3d(0px, 1px, 0px);\n  }\n}\n\n@keyframes glow_010 {\n  0% {\n    color: rgb(94, 94, 94);\n    -webkit-filter: drop-shadow(0 0 0.75rem rgb(255, 214, 90));\n    filter: drop-shadow(0 0 0.75rem rgb(255, 214, 90));\n  }\n\n adient(hsl(30, 90%, 90%) 90%, hsl(0, 90%, 85%) 90%);\n  transform: rotate(-25deg);\n}\n\n.hamster__tail {\n  animation: hamsterTail var(--dur) linear infinite;\n  background: hsl(0, 90%, 85%);\n  border-radius: 0.25em 50% 50% 0.25em;\n  box-shadow: 0 -0.2em 0 hsl(0, 90%, 75%) inset;\n  top: 1.5em;\n  right: -0.5em;\n  width: 1em;\n  height: 0.5em;\n  transform: rotate(30deg) translateZ(-1px);\n  transform-origin: 0.25em 0.25em;\n}\n\n.spoke {\n  animation: spoke var(--dur) linear infinite;\n  background: radial-gradient(\n      100% 100% at center,\n      hsl(0, 0%, 60%) 4.8%,\n      hsla(0, 0%, 60%, 0) 5%\n    ),\n    linear-gradient(\n        hsla(0, 0%, 55%, 0) 46.9%,\n        hsl(0, 0%, 65%) 47% 52.9%,\n        hsla(0, 0%, 65%, 0) 53%\n      ) 50% 50% / 99% 99% no-repeat;\n}\n\n/* Animations */\n@keyframes hamster {\n  from,\n  to {\n    transform: rotate(4deg) translate(-0.8em, 1.85em);\n  }\n\n  50% {\n    transform: rotate(0) translate(-0.8em, 1.85em);\n  }\n}\n\n@keyframes hamsterHead {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(0);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(8deg);\n  }\n}\n\n@keyframes hamsterEye {\n  from,\n  90%,\n  to {\n    transform: scaleY(1);\n  }\n\n  95% {\n    transform: scaleY(0);\n  }\n}\n\n@keyframes hamsterEar {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(0);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(12deg);\n  }\n}\n\n@keyframes hamsterBody {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(0);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(-2deg);\n  }\n}\n\n@keyframes hamsterFRLimb {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(50deg) translateZ(-1px);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(-30deg) translateZ(-1px);\n  }\n}\n\n@keyframes hamsterFLLimb {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(-30deg);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(50deg);\n  }\n}\n\n@keyframes hamsterBRLimb {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(-60deg) translateZ(-1px);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(20deg) translateZ(-1px);\n  }\n}\n\n@keyframes hamsterBLLimb {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(20deg);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(-60deg);\n  }\n}\n\n@keyframes hamsterTail {\n  from,\n  25%,\n  50%,\n  75%,\n  to {\n    transform: rotate(30deg) translateZ(-1px);\n  }\n\n  12.5%,\n  37.5%,\n  62.5%,\n  87.5% {\n    transform: rotate(10deg) translateZ(-1px);\n  }\n}\n\n@keyframes spoke {\n  from {\n    transform: rotate(0);\n  }\n\n  to {\n    transform: rotate(-1turn);\n  }\n}\n","type":"loaders","slug":"wet-mayfly-23"},{"title":"weak-bulldog-22","made_by":"csozidev","html":"\n\u003cdiv class=\"loader\"\u003e\n  \u003cdiv class=\"box box-1\"\u003e\n    \u003cdiv class=\"side-left\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-right\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-top\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"box box-2\"\u003e\n    \u003cdiv class=\"side-left\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-right\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-top\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"box box-3\"\u003e\n    \u003cdiv class=\"side-left\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-right\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-top\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"box box-4\"\u003e\n    \u003cdiv class=\"side-left\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-right\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"side-top\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","css":"\n/* 3D tower loader made by: csozi | Website: www.csozi.hu*/\n\n.loader {\n  scale: 3;\n  heig div\u003e\n  \u003cdiv class=\"loader\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.loader {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  z-index: 10;\n  width: 160px;\n  height: 100px;\n  margin-left: -80px;\n  margin-top: -50px;\n  border-radius: 5px;\n  background: #1e3f57;\n  animation: dot1_ 3s cubic-bezier(0.55, 0.3, 0.24, 0.99) infinite;\n}\n\n.loader:nth-child(2) {\n  z-index: 11;\n  width: 150px;\n  height: 90px;\n  margin-top: -45px;\n  margin-left: -75px;\n  border-radius: 3px;\n  background: #3c517d;\n  animation-name: dot2_;\n}\n\n.loader:nth-child(3) {\n  z-index: 12;\n  width: 40px;\n  height: 20px;\n  margin-top: 50px;\n  margin-left: -20px;\n  border-radius: 0 0 5px 5px;\n  background: #6bb2cd;\n  animation-name: dot3_;\n}\n\n@keyframes dot1_ {\n  3%,\n  97% {\n    width: 160px;\n    height: 100px;\n    margin-top: -50px;\n    margin-left: -80px;\n  }\n\n  30%,\n  36% {\n    width: 80px;\n    height: 120px;\n    margin-top: -60px;\n    margin-left: -40px;\n  }\n\n  63%,\n  69% {\n    width: 40px;\n    height: 80px;\n    margin-top: -40px;\n    margin-left: -20px;\n  }\n}\n\n@keyframes dot2_ {\n  3%,\n  97% {\n    height: 90px;\n    width: 150px;\n    margin-left: -75px;\n    margin-top: -45px;\n  }\n\n  30%,\n  36% {\n    width: 70px;\n    height: 96px;\n    margin-left: -35px;\n    margin-top: -48px;\n  }\n\n  63%,\n  69% {\n    width: 32px;\n    height: 60px;\n    margin-left: -16px;\n    margin-top: -30px;\n  }\n}\n\n@keyframes dot3_ {\n  3%,\n  97% {\n    height: 20px;\n    width: 40px;\n    margin-left: -20px;\n    margin-top: 50px;\n  }\n\n  30%,\n  36% {\n    width: 8px;\n    height: 8px;\n    margin-left: -5px;\n    margin-top: 49px;\n    border-radius: 8px;\n  }\n\n  63%,\n  69% {\n    width: 16px;\n    height: 4px;\n    margin-left: -8px;\n    margin-top: -37px;\n    border-radius: 10px;\n  }\n}\n","type":"loaders","slug":"ugly-skunk-66"},{"title":"tricky-catfish-63","made_by":"Pradeepsaranbishnoi","theme":"dark","html":"\n\u003cdiv class=\"code-loader\"\u003e\u003cspan\u003e{\u003c/span\u003e\u003cspan\u003e}\u003c/span\u003e\u003c/div\u003e\n","css":"\n.code-loader {\n  color: #fff;\n  font-family: Consolas, Menlo, Monaco, monospace;\n  font-weight: bold;\n  font-size: 100px;\n  opacity: 0.8;\n}\n\n.code-loader span {\n  display: inline-block;\n  animation: pulse_414 0.4s alternate infinite ease-in-out;\n}\n\n.code-loader span:nth-child(odd) {\n  animation-delay: 0.4s;\n}\n\n@keyframes pulse_414 {\n  to {\n    transform: scale(0.8);\n    opacity: 0.5;\n  }\n}\n","type":"loaders","slug":"tricky-catfish-63"},{"title":"tough-baboon-87","made_by":"SchawnnahJ","html":"\n\u003cdiv class=\"loader\"\u003e\u003c/div\u003e\n","css":"\n.loader {\n  position: relative;\n  width: 2.5em;\n  height: 2.5em;\n  transform: rotate(165deg);\n}\n\n.loader:before,\n.loader:after {\n  content: '';\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  display: block;\n  width: 0.5em;\n  height: 0.5em;\n  border-radius: 0.25em;\n  transform: translate(-50%, -50%);\n}\n\n.loader:before {\n  animation: before8 2s infinite;\n}\n\n.loader:after {\n  animation: after6 2s infinite;\n}\n\n@keyframes before8 {\n  0% {\n    width: 0.5em;\n    box-shadow: 1em -0.5em rgba(225, 20, 98, 0.75), -1em 0.5em rgba(111, 202, 220, 0.75);\n  }\n\n  35% {\n    width: 2.5em;\n    box-shadow: 0 -0.5em rgba(225, 20, 98, 0.75), 0 0.5em rgba(111, 202, 220, 0.75);\n  }\n\n  70% {\n    width: 0.5em;\n    box-shadow: -1em -0.5em rgba(225, 20, 98, 0.75), 1em 0.5em rgba(111, 202, 220, 0.75);\n  }\n\n  100% {\n    box-shadow: 1em -0.5em rgba(225, 20, 98, 0.75), -1em 0.5em rgba(111, 202, 220, 0.75);\n  }\n}\n\n@keyframes after6 {\n  0% {\n    height: 0.5em;\n    box-shadow: 0.5em 1em rgba(61, 184, 143, 0.75), -0.5em -1em rgba(233, 169, 32, 0.75);\n  }\n\n  35% {\n    height: 2.5em;\n    box-shadow: 0.5em 0 rgba(61, 184, 143, 0.75), -0.5em 0 rgba(233, 169, 32, 0.75);\n  }\n\n  70% {\n    height: 0.5em;\n    box-shadow: 0.5em -1em rgba(61, 18 cinput type=\"checkbox\" /\u003e\n  \u003cspan class=\"slider\"\u003e\u003c/span\u003e\n\u003c/label\u003e\n","css":"\n/* The switch - the box around the slider */\n.switch {\n  font-size: 17px;\n  position: relative;\n  display: inline-block;\n  width: 3.5em;\n  height: 2em;\n}\n\n/* Hide default HTML checkbox */\n.switch input {\n  opacity: 0;\n  width: 0;\n  height: 0;\n}\n\n/* The slider */\n.slider {\n  position: absolute;\n  cursor: pointer;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  background-color: rgb(0, 0, 0);\n  transition: 0.4s;\n  border-radius: 30px;\n}\n\n.slider:before {\n  position: absolute;\n  content: '';\n  height: 1.4em;\n  width: 1.4em;\n  border-radius: 20px;\n  left: 0.3em;\n  bottom: 0.3em;\n  background-color: rgb(219, 198, 2);\n  transition: 0.4s;\n}\n\ninput:checked + .slider {\n  background-color: #000000;\n}\n\ninput:focus + .slider {\n  box-shadow: 0 0 1px #000000;\n}\n\ninput:checked + .slider:before {\n  transform: translateX(1.5em);\n}\n\n.slider::after {\n  width: 20px;\n  height: 20px;\n  left: 20%;\n  top: 10%;\n  border-radius: 50%;\n  position: absolute;\n  content: '';\n  background-color: rgb(0, 0, 0);\n  transition: ease 0.4s;\n}\n\ninput:checked + .slider::after {\n  left: 80%;\n  width: 0px;\n  height: 0px;\n}\n","type":"switches","slug":"tough-monkey-56"},{"title":"terrible-snail-51","made_by":"Alaner","theme":"dark","html":"\n\u003clabel class=\"switch\"\u003e\n  \u003cinput type=\"checkbox\" /\u003e\n  \u003cspan class=\"slider\"\u003e\u003c/span\u003e\n\u003c/label\u003e\n","css":"\n/* The switch - the box around the slider */\n.switch {\n  font-size: 15px;\n  position: relative;\n  display: inline-block;\n  width: 4.5em;\n  height: 2em;\n}\n\n/* Hide default HTML checkbox */\n.switch input {\n  background-color: transparent;\n  opacity: 0;\n  width: 0;\n  height: 0;\n}\n\n/* The slider */\n.slider {\n  position: absolute;\n  cursor: pointer;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  background-i e\n    \u003cli class=\"back\"\u003e\u003c/li\u003e\n    \u003cli class=\"left\"\u003e\u003c/li\u003e\n    \u003cli class=\"right\"\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003c!-- cube-outer --\u003e\n  \u003cul class=\"cube-outer\"\u003e\n    \u003cli class=\"top\"\u003e\u003c/li\u003e\n    \u003cli class=\"bottom\"\u003e\u003c/li\u003e\n    \u003cli class=\"front\"\u003e\u003c/li\u003e\n    \u003cli class=\"back\"\u003e\u003c/li\u003e\n    \u003cli class=\"left\"\u003e\u003c/li\u003e\n    \u003cli class=\"right\"\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n","css":"\nul {\n  margin: 0;\n  padding: 0;\n  list-style: none;\n}\n\n.webpack-logo {\n  width: 100%;\n  height: 200px;\n  /* border: 1px solid red; */\n\n  position: relative;\n}\n.cube-inner {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  /* 关键,不要用 transform */\n  margin: -25px 0px 0px -25px;\n  width: 50px;\n  height: 50px;\n  /* background-color: red; */\n\n  /* 启用3D空间 */\n  transform-style: preserve-3d;\n  transform: rotateX(-33.5deg) rotateY(45deg);\n  /* 帧动画 */\n  animation: innerLoop 4s ease-in-out infinite;\n}\n\n.cube-inner li {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  background-color: #175d96;\n  border: 1px solid white;\n}\n\n.cube-inner .top {\n  transform: rotateX(90deg) translateZ(25px);\n}\n\n.cube-inner .bottom {\n  transform: rotateX(-90deg) translateZ(25px);\n}\n\n.cube-inner .front {\n  transform: rotateX(0deg) translateZ(25px);\n}\n\n.cube-inner .back {\n  transform: rotateX(-180deg) translateZ(25px);\n}\n.cube-inner .left {\n  transform: rotateY(-90deg) translateZ(25px);\n}\n\n.cube-inner .right {\n  transform: rotateY(90deg) translateZ(25px);\n}\n\n/* cube outer */\n.cube-outer {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  /* 关键,不要用 transform */\n  margin: -50px 0px 0px -50px;\n  width: 100px;\n  height: 100px;\n\n  /* 启用3D空间 */\n  transform-style: preserve-3d;\n  transform: rotateX(-33.5deg) rotateY(45deg);\n  /* 帧动画 */\n  animation: outerLoop 4s ease-in-out infinite;\n}\n\n.cube-outer li {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  background-color: rgba(141, 214, 249, 0.5);\n  border: 1px solid white;\n}\n\n.cube-outer .top {\n  transform: rotateX(90deg) translateZ(50px);\n}\n\n.cube-outer .bottom {\n  transform: rotateX(-90deg) translateZ(50px);\n}\n\n.cube-outer .front {\n  transform: rotateX(0deg) translateZ(50px);\n}\n\n.cube-outer .back {\n  transform: rotateX(-180deg) translateZ(50px);\n}\n.cube-outer .left {\n  transform: rotateY(-90deg) translateZ(50px);\n}\n\n.cube-outer .right {\n  transform: rotateY(90deg) translateZ(50px);\n}\n\n@keyframes outerLoop {\n  0% {\n    transform: rotateX(-33.5deg) rotateY(45deg);\n  }\n\n  50%,\n  100% {\n    transform: rotateX(-33.5deg) rotateY(405deg);\n  }\n}\n\n@keyframes innerLoop {\n  0% {\n    transform: rotateX(-33.5deg) rotateY(45deg);\n  }\n\n  50%,\n  100% {\n    transform: rotateX(-33.5deg) rotateY(-315deg);\n  }\n}\n","type":"others","slug":"webpack"},{"title":"typing-Effect","made_by":"denic","html":"\n\u003cdiv class=\"wrapper\"\u003e\n  \u003cdiv class=\"typing-demo\"\u003eThis is a typing demo.\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.typing-demo {\n  width: 22ch;\n  animation: typing 8s steps(22) infinite, blink 0.5s step-end infinite\n      alternate;\n  white-space: nowrap;\n  overflow: hidden;\n  border-right: 3px solid;\n  font-family: monospace;\n  font-size: 2em;\n}\n\n@keyframes typing {\n  0% {\n    width: 0;\n  }\n  50% {\n    width: 22ch;\n  }\n  100% {\n    width: 0;\n  }\n}\n\n@keyframes blink {\n  50% {\n    border-color: transparent;\n  }\n}\n","type":"others","slug":"typing-Effect"},{"title":"text-animation","made_by":"yemon","html":"\n\u003cdiv id=container\u003e\n  Make \n  \u003cdiv id=flip\u003e\n    \u003cdiv\u003e\u003cdiv\u003ewOrK\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv\u003elifeStyle\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv\u003eEverything\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  AweSoMe!\n\u003c/div\u003e\n","css":"\n#container {\n  color:#999;\n  text-transform: uppercase;\n  font-size:36px;\n  font-weight:bold;\n  display:block;\n}\n\n#flip {\n  height:50px;\n  overflow:hidden;\n}\n\n#flip \u003e div \u003e div {\n  color:#fff;\n  padding:4px 12px;\n  height:45px;\n  margin-bottom:45px;\n  display:inline-block;\n}\n\n#flip div:first-child {\n  animation: show 5s linear infinite;\n}\n\n#flip div div {\n  background:#42c58a;\n}\n#flip div:first-child div {\n  background:#4ec7f3;\n}\n#flip div:last-child div {\n  background:#DC143C;\n}\n\n@keyframes show {\n  0% {margin-top:-270px;}\n  5% {margin-top:-180px;}\n  33% {margin-top:-180px;}\n  38% {margin-top:-90px;}\n  66% {margin-top:-90px;}\n  71% {margin-top:0px;}\n  99.99% {margin-top:0px;}\n  100% {margin-top:-270px;}\n}\n\np {\n  position:fixed;\n  width:100%;\n  bottom:30px;\n  font-size:12px;\n  color:#999;\n  margin-top:200px;\n}\n","type":"others","slug":"text-animation"},{"title":"terrible-goose-14","made_by":"fanishah","theme":"dark","html":"\n\u003cdiv class=\"planet\"\u003e\u003c/div\u003e\n","css":"\n.planet {\n  display: block;\n  width: 125px;\n  height: 125px;\n  position: relative;\n  transform-style: preserve-3d;\n  border-radius: 50%;\n  background: #fcc96b;\n  background: #fcc96b;\n  background: linear-gradient(\n    180deg,\n    #fcc96b 0%,\n    #fcc96b 15%,\n    #f7ae01 15%,\n    #f7ae01 19%,\n    #fcc96b 19%,\n    #fcc96b 22%,\n    #f7ae01 22%,\n    #f7ae01 28%,\n    #fcc96b 28%,\n    #fcc96b 31%,\n    #fcc96b 33%,\n    #fcc96b 36%,\n    #f7ae01 36%,\n    #f7ae01 48%,\n    #fcc96b 48%,\n    #fcc96b 55%,\n    #f7ae01 55%,\n    #f7ae01 66%,\n    #fcc96b 66%,\n    #fcc96b 70%,\n    #f7ae01 70%,\n    #f7ae01 73%,\n    #fcc96b 73%,\n    #fcc96b 82%,\n    #f7ae01 82%,\n    #c7ba9d 86%,\n    #fcc96b 86%\n  );\n  box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.25), inset 8px -4px 6px rgb 8%);\n  --red2: hsl(345, 100%, 38%);\n  --white1: hsl(0, 0%, 100%);\n  --white2: hsl(0, 0%, 90%);\n  --blue: hsl(215, 100%, 20%);\n  font-size: calc(16px + (20 - 16) * (100vw - 320px) / (1280 - 320));\n  --dur: 1.5s;\n  position: relative;\n  width: 18em;\n  height: 18em;\n}\n.gift__bow,\n.gift__bow-center,\n.gift__bow-left,\n.gift__bow-right,\n.gift__box,\n.gift__lid,\n.gift__lid-shadow,\n.gift__star {\n  position: absolute;\n}\n.gift__bow-center,\n.gift__bow-left,\n.gift__bow-right {\n  background-color: var(--red2);\n}\n.gift__bow {\n  animation: bowBounce var(--dur) ease-in-out infinite;\n  bottom: 11em;\n  left: 7.5em;\n  width: 3em;\n  height: 2em;\n  transform-origin: 50% 230%;\n}\n.gift__bow-center {\n  border-radius: 1em;\n  width: 100%;\n  height: 100%;\n}\n.gift__bow-left,\n.gift__bow-right {\n  box-shadow: 0 0 0 0.7em var(--red1) inset;\n  top: 0.3em;\n  width: 4em;\n  height: 5em;\n  z-index: -1;\n}\n.gift__bow-left:before,\n.gift__bow-right:before {\n  background-color: var(--red1);\n  border-radius: inherit;\n  content: '';\n  display: block;\n  position: absolute;\n  inset: 0;\n}\n.gift__bow-left {\n  animation: bowLeftPivot var(--dur) ease-in-out infinite;\n  border-radius: 1.5em 0 3em 1em / 1.5em 0 3em 3.5em;\n  right: calc(100% - 0.75em);\n  transform: rotate(35deg);\n  transform-origin: 100% 15%;\n}\n.gift__bow-left:before {\n  clip-path: polygon(0 42%, 100% 12%, 100% 100%, 0 100%);\n}\n.gift__bow-right {\n  animation: bowRightPivot var(--dur) ease-in-out infinite;\n  border-radius: 0 1.5em 1em 3em / 0 1.5em 3.5em 3em;\n  left: calc(100% - 0.75em);\n  transform: rotate(-35deg);\n  transform-origin: 0% 15%;\n}\n.gift__bow-right:before {\n  clip-path: polygon(0 12%, 100% 42%, 100% 100%, 0 100%);\n}\n.gift__box,\n.gift__lid,\n.gift__lid-shadow {\n  transform-origin: 50% 100%;\n}\n.gift__box {\n  animation: boxBounce var(--dur) ease-in-out infinite;\n  background: linear-gradient(var(--red2), var(--red2)) 50% 50% / 3.3em 100% no-repeat,\n    var(--white2);\n  border-radius: 1.5em;\n  bottom: 0.5em;\n  left: 3.3em;\n  overflow: hidden;\n  width: 11.4em;\n  height: 9em;\n}\n.gift__lid,\n.gift__lid-shadow {\n  border-radius: 1em;\n  width: 13em;\n  height: 3.3em;\n}\n.gift__lid {\n  animation: lidBounce var(--dur) ease-in-out infinite;\n  background: linear-gradient(var(--red1), var(--red1)) 50% 50% / 3.3em 100% no-repeat,\n    var(--white1);\n  bottom: 8.7em;\n  left: 2.5em;\n}\n.gift__lid-shadow {\n  animation: lidShadowBounce var(--dur) ease-in-out infinite;\n  background-color: hsla(0, 0%, 0%, 0.1);\n  top: -1.5em;\n  left: -1em;\n}\n.gift__star {\n  animation: starRotateCW var(--dur) ease-in infinite;\n  background-color: var(--white1);\n  clip-path: polygon(\n    50% 0,\n    65% 35%,\n    100% 50%,\n    65% 65%,\n    50% 100%,\n    35% 65%,\n    0 50%,\n    35% 35%\n  );\n  transform: scale(0);\n}\n.gift__star--2,\n.gift__star--4,\n.gift__star--5 {\n  animation-name: starRotateCCW;\n}\n.gift__star--1 {\n  animation-delay: calc(var(--dur) * 0.5);\n  top: 0;\n  left: 12.5em;\n  width: 1.5em;\n  height: 1.5em;\n}\n.gift__star--2 {\n  animation-delay: calc(var(--dur) * 0.125);\n  top: 2em;\n  left: 10em;\n  width: 1.75em;\n  height: 1.75em;\n}\n.gift__star--3 {\n  animation-delay: calc(var(--dur) * 0.25);\n  top: 8em;\n  left: 0;\n  width: 1.25em;\n  height: 1.25em;\n}\n.gift__star--4 {\n  top: 10.5em;\n  right: 0;\n  width: 1.75em;\n  height: 1.75em;\n}\n.gift__star--5 {\n  animation-delay: calc(var(--dur) * 0.375);\n  top: 12em;\n  left: 1.8em;\n  width: 2.5em;\n  height: 2.5em;\n}\n\n/* Animations */\n@keyframes bowBounce {\n  from,\n  50% {\n    transform: translateY(0) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(75%) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-37.5%) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-150%) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(65%) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) rotate(0);\n  }\n}\n@keyframes bowLeftPivot {\n  from,\n  50% {\n    transform: rotate(35deg);\n  }\n  62.5% {\n    transform: rotate(45deg);\n  }\n  75% {\n    transform: rotate(30deg);\n  }\n  87.5% {\n    transform: rotate(45deg);\n  }\n  to {\n    transform: rotate(35deg);\n  }\n}\n@keyframes bowRightPivot {\n  from,\n  50% {\n    transform: rotate(-35deg);\n  }\n  62.5% {\n    transform: rotate(-45deg);\n  }\n  75% {\n    transform: rotate(-34deg);\n  }\n  87.5% {\n    transform: rotate(-45deg);\n  }\n  to {\n    transform: rotate(-35deg);\n  }\n}\n@keyframes boxBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1);\n  }\n  62.5% {\n    transform: translateY(4%) scale(1.12, 0.89);\n  }\n  75% {\n    transform: translateY(-11%) scale(0.92, 1.1);\n  }\n  87.5% {\n    transform: translateY(0) scale(1.05, 0.9);\n  }\n  to {\n    transform: translateY(0) scale(1, 1);\n  }\n}\n@keyframes lidBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(45%) scale(1.14, 0.95) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-22.5%) scale(1.05, 1.03) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-90%) scale(0.96, 1.1) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(30%) scale(1.12, 0.93) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n}\n@keyframes lidShadowBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(10%) scale(1.14, 0.95) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-10%) scale(1.05, 1.03) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-30%) scale(0.96, 1.1) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(10%) scale(1.12, 0.93) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n}\n@keyframes starRotateCW {\n  from {\n    transform: scale(0) rotate(0);\n  }\n  25% {\n    animation-timing-function: ease-out;\n    transform: scale(1) rotate(0.25turn);\n  }\n  50%,\n  to {\n    transform: scale(0) rotate(0.5turn);\n  }\n}\n@keyframes starRotateCCW {\n  from {\n    transform: scale(0) rotate(0);\n  }\n  25% {\n    animation-timing-function: ease-out;\n    transform: scale(1) rotate(-0.25turn);\n  }\n  50%,\n  to {\n    transform: scale(0) rotate(-0.5turn);\n  }\n}\n","type":"others","slug":"skiny-jumping-gift"},{"title":"silly-insect-34","made_by":"JkHuger","theme":"dark","html":"\n\u003cdiv class=\"rating\"\u003e\n  \u003cform class=\"rating-form\"\u003e\n    \u003clabel for=\"super-happy\" class=\"lb\"\u003e\n      \u003cinput\n        type=\"radio\"\n        name=\"rating\"\n        class=\"super-happy\"\n        id=\"super-happy\"\n        value=\"super-happy\"\n      /\u003e\n      \u003csvg class=\"svg\" viewBox=\"0 0 24 24\"\u003e\n        \u003cpath\n          d=\"M12,17.5C14.33,17.5 16.3,16.04 17.11,14H6.89C7.69,16.04 9.67,17.5 12,17.5M8.5,11A1.5,1.5 0 0,0 10,9.5A1.5,1.5 0 0,0 8.5,8A1.5,1.5 0 0,0 7,9.5A1.5,1.5 0 0,0 8.5,11M15.5,11A1.5,1.5 0 0,0 17,9.5A1.5,1.5 0 0,0 15.5,8A1.5,1.5 0 0,0 14,9.5A1.5,1.5 0 0,0 15.5,11M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z\"\n        \u003e\u003c/path\u003e\n      \u003c/svg\u003e\n    \u003c/label\u003e\n    \u003clabel for=\"neutral\" class=\"lb\"\u003e\n      \u003cinput\n        type=\"radio\"\n        name=\"rating\"\n        class=\"neutral\"\n        id=\"neutral\"\n        value=\"neutral\"\n      /\u003e\n      \u003csvg\n        class=\"svg\"\n        xmlns=\"http:// \n  padding: 0.8rem;\n  width: 33rem;\n}\n\n.rating-container {\n  display: -webkit-box;\n  display: -ms-flexbox;\n  display: flex;\n  -webkit-box-pack: justify;\n  -ms-flex-pack: justify;\n  justify-content: space-between;\n  padding: 0.4rem 0.8rem;\n  width: 100%;\n}\n\n.rating {\n  background-color: rgba(0, 0, 16, 0.8);\n  padding: 0.4rem 0.4rem 0.1rem 0.4rem;\n  border-radius: 2.2rem;\n}\n\n.rating-form {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n}\n\n.svg {\n  fill: rgb(242, 242, 242);\n  height: 3.6rem;\n  width: 3.6rem;\n  margin: 0.2rem;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n}\n\n.rating-form-2 svg {\n  height: 3rem;\n  width: 3rem;\n  margin: 0.5rem;\n}\n\n#radios label {\n  position: relative;\n}\n\n.super-happy,\n[type='radio'] {\n  position: absolute;\n  opacity: 0;\n}\n\n.input,\n[type='radio'] + svg {\n  -webkit-transition: all 0.2s;\n  transition: all 0.2s;\n}\n\n.super-happy[class='super-happy']:hover + svg,\n.super-happy[class='super-happy']:checked + svg,\n.super-happy[class='super-happy']:focus + svg {\n  fill: rgb(0, 204, 79);\n  transition: 1.5s;\n}\n\n.neutral[class='neutral']:hover + svg,\n.neutral[class='neutral']:checked + svg,\n.neutral[class='neutral']:focus + svg {\n  fill: rgb(232, 214, 0);\n  transition: 1.5s;\n}\n\n.super-sad[class='super-sad']:hover + svg,\n.super-sad[class='super-sad']:checked + svg,\n.super-sad[class='super-sad']:focus + svg {\n  fill: rgb(239, 42, 16);\n  transition: 1.5s;\n}\n","type":"others","slug":"silly-insect-34"},{"title":"show-card","made_by":"gayane-gasparyan","html":"\n\u003cdiv class=\"card\"\u003e\n  \u003cdiv class=\"wrapper\"\u003e\n    \u003cimg\n      src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-cover.jpg\"\n      class=\"cover-image\"\n    /\u003e\n  \u003c/div\u003e\n  \u003cimg\n    src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-title.png\"\n    class=\"title\"\n  /\u003e\n  \u003cimg\n    src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-character.webp\"\n    class=\"character\"\n  /\u003e\n\u003c/div\u003e\n","css":"\n.card {\n  --card-height: 200px;\n  --card-width: calc(var(--card-height) / 1.5);\n  width: var(--card-width);\n  height: var(--card-height);\n  position: relative;\n  display: flex;\n  justify-content: center;\n  align-items: flex-end;\n  padding: 0 36px;\n  perspective: 2500px;\n  margin: 0 50px;\n}\n\n.cover-image {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.wrapper {\n  transition: all 0.5s;\n  position: absolute;\n  width: 100%;\n  z-index: -1;\n}\n\n.card:hover .wrapper {\n  transform: perspective(900px) translateY(-5%) rotateX(25deg) translateZ(0);\n  box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n  -webkit-box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n  -moz-box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n}\n\n.wrapper::before,\n.wrapper::after {\n  content: '';\n  opacity: 0;\n  width: 100%;\n  height: 80px;\n  transition: all 0.5s;\n  position: absolute;\n  left: 0;\n}\n.wrapper::before {\n  top: 0;\n  height: 100%;\n  background-image: linear-gradient(\n    to top,\n    transparent 46%,\n    rgba(12, 13, 19, 0.5) 68%,\n    rgba(12, 13, 19) 97%\n  );\n}\n.wrapper::after {\n  bottom: 0;\n  opacity: 1;\n  background-image: linear-gradient(\n    to bottom,\n    transparent 46%,\n    rgba(12, 13, 19, 0.5) 68%,\n    rgba(12, 13, 19) 97%\n  );\n}\n\n.card:hover .wrapper::before,\n.wrapper::after {\n  opacity: 1;\n}\n\n.card:hover .wrapper::after {\n  height: 120px;\n}\n.title {\n  width: 100%;\n  transition: transform 0.5s;\n}\n.card:hover .title {\n  transform: translate3d(0%, -50px, 100px);\n}\n\n.character {\n  width: 100%;\n  opacity: 0;\n  transition: all 0.5s;\n  position: absolute;\n  z-index: -1;\n}\n\n.card:hover .character {\n  opacity: 1;\n  transform: translate3d(0%, -30%, 100px);\n}\n","type":"others","slug":"show-card"},{"title":"pokeball","made_by":"andreasnylin","html":"\n\u003cdiv class=\"ball\"\u003e\n  \u003cdiv class=\"top\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"mid\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"bottom\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"btn\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.ball {\n  --ball-size: 188px;\n  --btn-size: calc(var(--ball-size) * .38);\n  --stripe-height: calc(var(--ball-size) * .06);\n  --shadow-width: calc(var(--ball-size) / 10);\n  --shadow-color: rgba(0,0,0,.075);\n  --bg-color: #2196f3;\n  --bg-color2: #0b77cd;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  width: var(--ball-size);\n  height: var(--ball-size);\n  border-radius: 50%;\n}\n\n.top {\n  height: calc(var(--ball-size) / 2 - (var(--stripe-height) / 2));\n  border-top-left-radius: 50% 100%;\n  border-top-right-radius: 50% 100%;\n  background: red;\n  box-shadow: var(--shadow-width) 0 0 var(--shadow-color) inset;\n}\n\n.top::after {\n  content: '';\n  position: absolute;\n  top: calc(11%);\n  left: calc(61%);\n  width: calc(var(--ball-size) * .3);\n  height: calc(var(--ball-size) * .17);\n  border-radius: 50%;\n  background-color: rgba(255,255,255,.7);\n  transform: rotate(40deg);\n}\n\n.mid {\n  align-self: center;\n  height: var(--stripe-height);\n  width: calc(var(--ball-size) * .96);\n  100%;\n  background: black;\n}\n\n.bottom {\n  height: calc(var(--ball-size) / 2 - (var(--stripe-height) / 2));\n  border-bottom-left-radius: 50% 100%;\n  border-bottom-right-radius: 50% 100%;\n  background: white;\n  box-shadow: var(--shadow-width) calc(var(--shadow-width) * -.2) 0 var(--shadow-color) inset;\n}\n\n.bottom::after {\n  content: '';\n  position: absolute;\n  top: calc(50% + var(--ball-size) / 2.25);\n  left: calc(50% - var(--ball-size) / 2.1);\n  width: calc(var(--ball-size) * .8);\n  height: calc(var(--ball-size) * .1);\n  border-radius: 50%;\n  background-color: rgba(0,0,0,.075);\n  z-index: -1;\n}\n\n.btn {\n  position: absolute;\n  top: calc(50% - var(--btn-size) / 2);\n  left: calc(50% - var(--btn-size) / 2);\n  width: var(--btn-size);\n  height: var(--btn-size);\n  border-radius: 50%;\n  background: white;\n  border: solid var(--stripe-height) black;\n  box-shadow: 1px 0px 0px black inset;\n}\n\n.btn:after {\n  --size: calc(var(--btn-size) * .45);\n  content: '';\n  position: absolute;\n  top: calc(50% - var(--size) / 2);\n  left: calc(50% - var(--size) / 2);\n  width: var(--size);\n  height: var(--size);\n  border-radius: 50%;\n  background: white;\n  border: solid 2px #666;\n}\n","type":"others","slug":"pokeball"},{"title":"orange-monkey-2","made_by":"demchenk0","theme":"dark","html":"\n\u003cdiv class=\"pyramid-loader\"\u003e\n  \u003cdiv class=\"wrapper\"\u003e\n    \u003cspan class=\"side side1\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side2\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side3\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side4\"\u003e\u003c/span\u003e\n    \u003cspan class=\"shadow\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.pyramid-loader {\n  position: relative;\n  width: 300px;\n  height: 300px;\n  display: block;\n  transform-style: preserve-3d;\n  transform: rotateX(-20deg);\n}\n\n.wrapper {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  transform-style: preserve-3d;\n  animation: spin 4s linear infinite;\n}\n\n@keyframes spin {\n  100% {\n    transform: rotateY(360deg);\n  }\n}\n\n.pyramid-loader .wrapper .side {\n  width: 70px;\n  height: 70px;\n  /* you can choose any gradient or color you want */\n  /* background: radial-gradient( #2F2585 10%, #F028FD 70%, #2BDEAC 120%); */\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  margin: auto;\n  transform-origin: center top;\n  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);\n}\n\n.pyramid-loader .wrapper .side1 {\n  transform: rotateZ(-30deg) rotateY(90deg);\n  background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);\n}\n\n.pyramid-loader .wrapper .side2 {\n  transform: rotateZ(30deg) rotateY(90deg);\n  background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);\n}\n\n.pyramid-loader .wrapper .side3 {\n  transform: rotateX(30deg);\n  background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);\n}\n\n.pyramid-loader .wrapper .side4 {\n  transform: rotateX(-30deg);\n  background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);\n}\n\n.pyramid-loader .wrapper .shadow {\n  width: 60px;\n  height: 60px;\n  background: #8b5ad5;\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  margin: auto;\n  transform: rotateX(90deg) translateZ(-40px);\n  filter: blur(12px);\n}\n","type":"others","slug":"orange-monkey-2"},{"title":"new-deer-97","made_by":"JkHuger","theme":"dark","html":"\n\u003cdiv class=\"box-of-star1\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position5\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position6\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position7\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"box-of-star2\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position5\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position6\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position7\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"box-of-star3\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position5\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position6\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position7\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"box-of-star4\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position5\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position6\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position7\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"astronaut\" data-js=\"astro\"\u003e\n  \u003cdiv class=\"head\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"arm arm-left\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"arm arm-right\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"body\"\u003e\n    \u003cdiv class=\"panel\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"leg leg-left\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"leg leg-right\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"schoolbag\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n@keyframes snow {\n  0% {\n    opacity: 0;\n    transform: translateY(0px);\n  }\n\n  20% {\n    opacity: 1;\n  }\n\n  100% {\n    opacity: 1;\n    transform: translateY(650px);\n  }\n}\n\n@keyframes astronaut {\n  0% {\n    transform: rotate(0deg);\n  }\n\n  100% {\n    transform: rotate(360deg);\n  }\n}\n\n.box-of-star1,\n.box-of-star2,\n.box-of-star3,\n.box-of-star4 {\n  width: 100%;\n  position: absolute;\n  z-index: 10;\n  left: 0;\n  transform: translateY(650px);\n  height: 700px;\n}\n\n.box-of-star1 {\n  animation: snow 5s linear infinite;\n}\n\n.box-of-star2 {\n  animation: snow 5s -1.64s linear infinite;\n}\n\n.box-of-star3 {\n  animation: snow 5s -2.3s linear infinite;\n}\n\n.box-of-star4 {\n  animation: snow 5s -3.3s linear infinite;\n}\n\n.star {\n  width: 3px;\n  height: 3px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  opacity: 0.7;\n}\n\n.star:before {\n  content: '';\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  top: 80px;\n  left: 70px;\n  opacity: 0.7;\n}\n\n.star:after {\n  content: '';\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  top: 8px;\n  left: 170px;\n  opacity: 0.9;\n}\n\n.star-position1 {\n  top: 30px;\n  left: 20px;\n}\n\n.star-position2 {\n  top: 110px;\n  left: 250px;\n}\n\n.star-position3 {\n  top: 60px;\n  left: 570px;\n}\n\n.star-position4 {\n  top: 120px;\n  left: 900px;\n}\n\n.star-position5 {\n  top: 20px;\n  left: 1120px;\n}\n\n.star-position6 {\n  top: 90px;\n  left: 1280px;\n}\n\n.star-position7 {\n  top: 30px;\n  left: 1480px;\n}\n\n.astronaut {\n  width: 250px;\n  height: 300px;\n  position: absolute;\n  z-index: 11;\n  top: calc(50% - 150px);\n  left: calc(50% - 125px);\n  animation: astronaut 5s linear infinite;\n}\n\n.schoolbag {\n  width: 100px;\n  height: 150px;\n  position: absolute;\n  z-index: 1;\n  top: calc(50% - 75px);\n  left: calc(50% - 50px);\n  background-color: #94b7ca;\n  border-radius: 50px 50px 0 0 / 30px 30px 0 0;\n}\n\n.head {\n  width: 97px;\n  height: 80px;\n  position: absolute;\n  z-index: 3;\n  background: -webkit-linear-gradient(\n    left,\n    #e3e8eb 0%,\n    #e3e8eb 50%,\n    #fbfdfa 50%,\n    #fbfdfa 100%\n  );\n  border-radius: 50%;\n  top: 34px;\n  left: calc(50% - 47.5px);\n}\n\n.head:after {\n  content: '';\n  width: 60px;\n  height: 50px;\n  position: absolute;\n  top: calc(50% - 25px);\n  left: calc(50% - 30px);\n  background: -webkit-linear-gradient(\n    top,\n    #15aece 0%,\n    #15aece 50%,\n    #0391bf 50%,\n    #0391bf 100%\n  ); 89%,\n    88% 100%,\n    5% 100%,\n    0% 85%\n  );\n  position: absolute;\n  inset: 1px;\n  background-color: #212121;\n  z-index: 1;\n}\n\n.neon-btn .txt {\n  text-align: right;\n  position: relative;\n  z-index: 2;\n  color: aliceblue;\n  font-size: 1em;\n  transition: all ease-in-out 2s linear;\n  text-shadow: 0px 0px 1px #4090b5, 0px 0px 1px #9e30a9, 0 0 1px white;\n}\n\n.neon-btn::before {\n  content: '';\n  position: absolute;\n  height: 300px;\n  aspect-ratio: 1.5/1;\n  box-shadow: -17px -19px 20px #9e30a9;\n  background-image: conic-gradient(\n    #9e30a9,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    #9e30a9\n  );\n  animation: rotate 4s linear infinite -2s;\n}\n\n.neon-btn::after {\n  content: '';\n  position: absolute;\n  height: 300px;\n  aspect-ratio: 1.5/1;\n  box-shadow: -17px -19px 10px #4090b5;\n  background-image: conic-gradient(\n    #4090b5,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    transparent,\n    #4090b5\n  );\n  animation: rotate 4s linear infinite;\n}\n\n@keyframes rotate {\n  0% {\n    transform: rotate(0deg);\n  }\n\n  to {\n    transform: rotate(360deg);\n  }\n}\n\n@keyframes colorchange {\n  0% {\n    text-shadow: 0px 0px 0px #9e30a9, 0px 0px 0px #4090b5,\n      0 0 0px rgba(255, 255, 255, 0.616);\n  }\n\n  50% {\n    text-shadow: -6px 5px 1px #9e30a9, 5px 11px 1px #4090b5,\n      0 0 20px rgba(255, 255, 255, 0.616);\n  }\n\n  to {\n    text-shadow: 2px 4px 1px #9e30a9, 2px 2px 1px #4090b5,\n      0 0 20px rgba(255, 255, 255, 0.616);\n  }\n}\n\n@keyframes backgroundchange {\n  0% {\n    background-color: transparent;\n  }\n\n  50% {\n    background-color: #4090b5;\n  }\n\n  to {\n    background-color: transparent;\n  }\n}\n","type":"others","slug":"friendly-panther-39"},{"title":"fast-cobra-20","made_by":"Pradeepsaranbishnoi","html":"\n\u003cdiv class=\"loader\"\u003e\n  \u003cdiv class=\"dot\"\u003e  15px 0 rgba(0, 0, 0, 0.8);\n    transform: rotateX(20deg) rotateY(20deg) rotateZ(50deg) translateZ(0px);\n  }\n\n  100% {\n    border-color: #447891;\n    box-shadow: inset 0 0 15px 0 rgba(255, 255, 255, 0.2);\n    transform: rotateX(24deg) rotateY(20deg) rotateZ(0deg) translateZ(-25px);\n  }\n}\n\n@keyframes dot3 {\n  0% {\n    border-color: #6bb2cd;\n    box-shadow: inset 0 0 15px 0 rgba(0, 0, 0, 0.1);\n    transform: rotateX(24deg) rotateY(20deg) rotateZ(0deg) translateZ(-25px);\n  }\n\n  50% {\n    border-color: #6bcdb2;\n    box-shadow: inset 0 0 15px 0 rgba(0, 0, 0, 0.8);\n    transform: rotateX(20deg) rotateY(20deg) rotateZ(50deg) translateZ(0px);\n  }\n\n  100% {\n    border-color: #6bb2cd;\n    box-shadow: inset 0 0 15px 0 rgba(0, 0, 0, 0.1);\n    transform: rotateX(24deg) rotateY(20deg) rotateZ(0deg) translateZ(-25px);\n  }\n}\n","type":"others","slug":"fast-cobra-20"},{"title":"Fancy-a-cuppa","made_by":"Chris-Smith","theme":"dark","html":"\n\u003cdiv class=\"container\"\u003e\n  \u003cdiv class=\"saucer\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"cup\"\u003e\n    \u003cdiv class=\"rim\"\u003e\n      \u003cdiv class=\"steam\"\u003e\n        \u003cspan style=\"--i: 1\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 3\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 16\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 5\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 13\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 6\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 19\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 8\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 10\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 18\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 8\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 17\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 11\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 7\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 14\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 2\"\u003e\u003c/span\u003e\n        \u003cspan style=\"-i: 9\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 12\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 15\"\u003e\u003c/span\u003e\n        \u003cspan style=\"--i: 4\"\u003e\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv class=\"inside\"\u003e\n        \u003cdiv class=\"tea\"\u003e\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"handle\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.container {\n  position: relative;\n  top: 50px;\n}\n.cup {\n  position: relative;\n  width: 280px;\n  height: 300px;\n  background: linear-gradient(to right, #f9f9f9, #c6c6c6 60%, #c1c1c1);\n  border-radius: 0 0 40% 40%;\n}\n\n/* holds the rim and inside of the cup and the 'tea' */\n.rim {\n  position: absolute;\n  top: -30px;\n  left: 0;\n  width: 100%;\n  height: 60px;\n  background: linear-gradient(to right, #f9f9f9, #c6c6c6);\n  border-radius: 50%;\n}\n.inside {\n  position: absolute;\n  top: 5px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: calc(100% - 15px);\n  height: 50px;\n  background: linear-gradient(to left, #f9f9f9, #c6c6c6);\n  border-radius: 50%;\n  overflow: hidden;\n}\n.tea {\n  position: absolute;\n  top: 15px;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  background: linear-gradient(90deg, #c57e65, #dd7048);\n  border-radius: 50%;\n}\n.handle {\n  position: absolute;\n  top: 35px;\n  right: -70px;\n  width: 160px;\n  height: 180px;\n  border: 25px solid #c1c1c1;\n  border-left: 25px solid transparent;\n  border-bottom: 25px solid transparent;\n  border-radius: 50%;\n  transform: rotate(42deg);\n}\n.saucer {\n  position: absolute;\n  bottom: -55px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 500px;\n  height: 180px;\n  background: linear-gradient(to right, #f9f9f9, #c6c6c6);\n  border-radius: 5
