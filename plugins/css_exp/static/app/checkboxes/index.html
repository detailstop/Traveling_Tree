ck\" type=\"checkbox\" /\u003e\n\n  \u003cspan class=\"top\"\u003e\u003c/span\u003e\n  \u003cspan class=\"middle\"\u003e\u003c/span\u003e\n  \u003cspan class=\"bottom\"\u003e\u003c/span\u003e\n\u003c/label\u003e\n","css":"\ninput[type='checkbox'] {\n  -webkit-appearance: none;\n  display: none;\n  visibility: hidden;\n}\n\n.bar {\n  position: relative;\n  cursor: pointer;\n  width: 50px;\n  height: 40px;\n}\n\n.bar span {\n  position: absolute;\n  width: 45px;\n  height: 7px;\n  background: #f1faee;\n  border-radius: 100px;\n  display: inline-block;\n  transition: 0.3s ease;\n  left: 0;\n}\n\n.bar span.top {\n  top: 0;\n}\n\n.bar span.middle {\n  top: 17px;\n}\n\n.bar span.bottom {\n  bottom: 0;\n}\n\ninput[type]:checked ~ span.top {\n  transform: rotate(45deg);\n  transform-origin: top left;\n  width: 48px;\n  left: 5px;\n}\n\ninput[type]:checked ~ span.bottom {\n  transform: rotate(-45deg);\n  transform-origin: top left;\n  width: 48px;\n  bottom: -1px;\n  box-shadow: 0 0 10px #495057;\n}\n\ninput[type]:checked ~ span.middle {\n  transform: translateX(-20px);\n  opacity: 0;\n}\n","type":"checkboxes","slug":"unlucky-termite-68"},{"title":"tigro-check","made_by":"tigro","html":"\n\u003cdiv class=\"checkbox-wrapper-62\"\u003e\n  \u003cinput type=\"checkbox\" class=\"check\" id=\"check1-62\" /\u003e\n  \u003clabel for=\"check1-62\" class=\"label\"\u003e\n    \u003csvg width=\"43\" height=\"43\" viewbox=\"0 0 90 90\"\u003e\n      \u003crect x=\"30\" y=\"20\" width=\"50\" height=\"50\" stroke=\"black\" fill=\"none\" /\u003e\n      \u003cg transform=\"translate(0,-952.36218)\"\u003e\n        \u003cpath\n          d=\"m 13,983 c 33,6 40,26 55,48 \"\n          stroke=\"black\"\n          stroke-width=\"3\"\n          class=\"path1\"\n          fill=\"none\"\n        /\u003e\n        \u003cpath\n          d=\"M 75,970 C 51,981 34,1014 25,1031 \"\n          stroke=\"black\"\n          stroke-width=\"3\"\n          class=\"path1\"\n          fill=\"none\"\n        /\u003e\n
