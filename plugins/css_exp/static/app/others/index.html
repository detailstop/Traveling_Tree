ube-inner .bottom {\n  transform: rotateX(-90deg) translateZ(25px);\n}\n\n.cube-inner .front {\n  transform: rotateX(0deg) translateZ(25px);\n}\n\n.cube-inner .back {\n  transform: rotateX(-180deg) translateZ(25px);\n}\n.cube-inner .left {\n  transform: rotateY(-90deg) translateZ(25px);\n}\n\n.cube-inner .right {\n  transform: rotateY(90deg) translateZ(25px);\n}\n\n/* cube outer */\n.cube-outer {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  /* 关键,不要用 transform */\n  margin: -50px 0px 0px -50px;\n  width: 100px;\n  height: 100px;\n\n  /* 启用3D空间 */\n  transform-style: preserve-3d;\n  transform: rotateX(-33.5deg) rotateY(45deg);\n  /* 帧动画 */\n  animation: outerLoop 4s ease-in-out infinite;\n}\n\n.cube-outer li {\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 100%;\n  height: 100%;\n  background-color: rgba(141, 214, 249, 0.5);\n  border: 1px solid white;\n}\n\n.cube-outer .top {\n  transform: rotateX(90deg) translateZ(50px);\n}\n\n.cube-outer .bottom {\n  transform: rotateX(-90deg) translateZ(50px);\n}\n\n.cube-outer .front {\n  transform: rotateX(0deg) translateZ(50px);\n}\n\n.cube-outer .back {\n  transform: rotateX(-180deg) translateZ(50px);\n}\n.cube-outer .left {\n  transform: rotateY(-90deg) translateZ(50px);\n}\n\n.cube-outer .right {\n  transform: rotateY(90deg) translateZ(50px);\n}\n\n@keyframes outerLoop {\n  0% {\n    transform: rotateX(-33.5deg) rotateY(45deg);\n  }\n\n  50%,\n  100% {\n    transform: rotateX(-33.5deg) rotateY(405deg);\n  }\n}\n\n@keyframes innerLoop {\n  0% {\n    transform: rotateX(-33.5deg) rotateY(45deg);\n  }\n\n  50%,\n  100% {\n    transform: rotateX(-33.5deg) rotateY(-315deg);\n  }\n}\n","type":"others","slug":"webpack"},{"title":"typing-Effect","made_by":"denic","html":"\n\u003cdiv class=\"wrapper\"\u003e\n  \u003cdiv class=\"typing-demo\"\u003eThis is a typing demo.\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.typing-demo {\n  width: 22ch;\n  animation: typing 8s steps(22) infinite, blink 0.5s step-end infinite\ nter\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"gift__box\"\u003e\n    \u003cdiv class=\"gift__lid-shadow\"\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cdiv class=\"gift__lid\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"gift__star gift__star--1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"gift__star gift__star--2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"gift__star gift__star--3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"gift__star gift__star--4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"gift__star gift__star--5\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.gift {\n  --red1: hsl(345, 100%, 48%);\n  --red2: hsl(345, 100%, 38%);\n  --white1: hsl(0, 0%, 100%);\n  --white2: hsl(0, 0%, 90%);\n  --blue: hsl(215, 100%, 20%);\n  font-size: calc(16px + (20 - 16) * (100vw - 320px) / (1280 - 320));\n  --dur: 1.5s;\n  position: relative;\n  width: 18em;\n  height: 18em;\n}\n.gift__bow,\n.gift__bow-center,\n.gift__bow-left,\n.gift__bow-right,\n.gift__box,\n.gift__lid,\n.gift__lid-shadow,\n.gift__star {\n  position: absolute;\n}\n.gift__bow-center,\n.gift__bow-left,\n.gift__bow-right {\n  background-color: var(--red2);\n}\n.gift__bow {\n  animation: bowBounce var(--dur) ease-in-out infinite;\n  bottom: 11em;\n  left: 7.5em;\n  width: 3em;\n  height: 2em;\n  transform-origin: 50% 230%;\n}\n.gift__bow-center {\n  border-radius: 1em;\n  width: 100%;\n  height: 100%;\n}\n.gift__bow-left,\n.gift__bow-right {\n  box-shadow: 0 0 0 0.7em var(--red1) inset;\n  top: 0.3em;\n  width: 4em;\n  height: 5em;\n  z-index: -1;\n}\n.gift__bow-left:before,\n.gift__bow-right:before {\n  background-color: var(--red1);\n  border-radius: inherit;\n  content: '';\n  display: block;\n  position: absolute;\n  inset: 0;\n}\n.gift__bow-left {\n  animation: bowLeftPivot var(--dur) ease-in-out infinite;\n  border-radius: 1.5em 0 3em 1em / 1.5em 0 3em 3.5em;\n  right: calc(100% - 0.75em);\n  transform: rotate(35deg);\n  transform-origin: 100% 15%;\n}\n.gift__bow-left:before {\n  clip-path: polygon(0 42%, 100% 12%, 100% 100%, 0 100%);\n}\n.gift__bow-right {\n  animation: bowRightPivot var(--dur) ease-in-out infinite;\n  border-radius: 0 1.5em 1em 3em / 0 1.5em 3.5em 3em;\n  left: calc(100% - 0.75em);\n  transform: rotate(-35deg);\n  transform-origin: 0% 15%;\n}\n.gift__bow-right:before {\n  clip-path: polygon(0 12%, 100% 42%, 100% 100%, 0 100%);\n}\n.gift__box,\n.gift__lid,\n.gift__lid-shadow {\n  transform-origin: 50% 100%;\n}\n.gift__box {\n  animation: boxBounce var(--dur) ease-in-out infinite;\n  background: linear-gradient(var(--red2), var(--red2)) 50% 50% / 3.3em 100% no-repeat,\n    var(--white2);\n  border-radius: 1.5em;\n  bottom: 0.5em;\n  left: 3.3em;\n  overflow: hidden;\n  width: 11.4em;\n  height: 9em;\n}\n.gift__lid,\n.gift__lid-shadow {\n  border-radius: 1em;\n  width: 13em;\n  height: 3.3em;\n}\n.gift__lid {\n  animation: lidBounce var(--dur) ease-in-out infinite;\n  background: linear-gradient(var(--red1), var(--red1)) 50% 50% / 3.3em 100% no-repeat,\n    var(--white1);\n  bottom: 8.7em;\n  left: 2.5em;\n}\n.gift__lid-shadow {\n  animation: lidShadowBounce var(--dur) ease-in-out infinite;\n  background-color: hsla(0, 0%, 0%, 0.1);\n  top: -1.5em;\n  left: -1em;\n}\n.gift__star {\n  animation: starRotateCW var(--dur) ease-in infinite;\n  background-color: var(--white1);\n  clip-path: polygon(\n    50% 0,\n    65% 35%,\n    100% 50%,\n    65% 65%,\n    50% 100%,\n    35% 65%,\n    0 50%,\n    35% 35%\n  );\n  transform: scale(0);\n}\n.gift__star--2,\n.gift__star--4,\n.gift__star--5 {\n  animation-name: starRotateCCW;\n}\n.gift__star--1 {\n  animation-delay: calc(var(--dur) * 0.5);\n  top: 0;\n  left: 12.5em;\n  width: 1.5em;\n  height: 1.5em;\n}\n.gift__star--2 {\n  animation-delay: calc(var(--dur) * 0.125);\n  top: 2em;\n  left: 10em;\n  width: 1.75em;\n  height: 1.75em;\n}\n.gift__star--3 {\n  animation-delay: calc(var(--dur) * 0.25);\n  top: 8em;\n  left: 0;\n  width: 1.25em;\n  height: 1.25em;\n}\n.gift__star--4 {\n  top: 10.5em;\n  right: 0;\n  width: 1.75em;\n  height: 1.75em;\n}\n.gift__star--5 {\n  animation-delay: calc(var(--dur) * 0.375);\n  top: 12em;\n  left: 1.8em;\n  width: 2.5em;\n  height: 2.5em;\n}\n\n/* Animations */\n@keyframes bowBounce {\n  from,\n  50% {\n    transform: translateY(0) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(75%) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-37.5%) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-150%) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(65%) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) rotate(0);\n  }\n}\n@keyframes bowLeftPivot {\n  from,\n  50% {\n    transform: rotate(35deg);\n  }\n  62.5% {\n    transform: rotate(45deg);\n  }\n  75% {\n    transform: rotate(30deg);\n  }\n  87.5% {\n    transform: rotate(45deg);\n  }\n  to {\n    transform: rotate(35deg);\n  }\n}\n@keyframes bowRightPivot {\n  from,\n  50% {\n    transform: rotate(-35deg);\n  }\n  62.5% {\n    transform: rotate(-45deg);\n  }\n  75% {\n    transform: rotate(-34deg);\n  }\n  87.5% {\n    transform: rotate(-45deg);\n  }\n  to {\n    transform: rotate(-35deg);\n  }\n}\n@keyframes boxBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1);\n  }\n  62.5% {\n    transform: translateY(4%) scale(1.12, 0.89);\n  }\n  75% {\n    transform: translateY(-11%) scale(0.92, 1.1);\n  }\n  87.5% {\n    transform: translateY(0) scale(1.05, 0.9);\n  }\n  to {\n    transform: translateY(0) scale(1, 1);\n  }\n}\n@keyframes lidBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(45%) scale(1.14, 0.95) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-22.5%) scale(1.05, 1.03) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-90%) scale(0.96, 1.1) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(30%) scale(1.12, 0.93) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n}\n@keyframes lidShadowBounce {\n  from,\n  50% {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n  62.5% {\n    animation-timing-function: ease-in;\n    transform: translateY(10%) scale(1.14, 0.95) rotate(0);\n  }\n  68.75% {\n    animation-timing-function: ease-out;\n    transform: translateY(-10%) scale(1.05, 1.03) rotate(15deg);\n  }\n  75% {\n    animation-timing-function: ease-in-out;\n    transform: translateY(-30%) scale(0.96, 1.1) rotate(5deg);\n  }\n  87.5% {\n    transform: translateY(10%) scale(1.12, 0.93) rotate(-3deg);\n  }\n  to {\n    transform: translateY(0) scale(1, 1) rotate(0);\n  }\n}\n@keyframes starRotateCW {\n  from {\n    transform: scale(0) rotate(0);\n  }\n  25% {\n    animation-timing-function: ease-out;\n    transform: scale(1) rotate(0.25turn);\n  }\n  50%,\n  to {\n    transform: scale(0) rotate(0.5turn);\n  }\n}\n@keyframes starRotateCCW {\n  from {\n    transform: scale(0) rotate(0);\n  }\n  25% {\n    animation-timing-function: ease-out;\n    transform: scale(1) rotate(-0.25turn);\n  }\n  50%,\n  to {\n    transform: scale(0) rotate(-0.5turn);\n  }\n}\n","type":"others","slug":"skiny-jumping-gift"},{"title":"silly-insect-34","made_by":"JkHuger","theme":"dark","html":"\n\u003cdiv class=\"rating\"\u003e\n  \u003cform class=\"rating-form\"\u003e\n    \u003clabel for=\"super-happy\" class=\"lb\"\u003e\n      \u003cinput\n        type=\"radio\"\n        name=\"rating\"\n        class=\"super-happy\"\n        id=\"super-happy\"\n        value=\"super-happy\"\n      /\u003e\n      \u003csvg class=\"svg\" viewBox=\"0 0 24 24\"\u003e\n        \u003cpath\n          d=\"M12,17.5C14.33,17.5 16.3,16.04 17.11,14H6.89C7.69,16.04 9.67,17.5 12,17.5M8.5,11A1.5,1.5 0 0,0 10,9.5A1.5,1.5 0 0,0 8.5 ver + svg,\n.super-sad[class='super-sad']:checked + svg,\n.super-sad[class='super-sad']:focus + svg {\n  fill: rgb(239, 42, 16);\n  transition: 1.5s;\n}\n","type":"others","slug":"silly-insect-34"},{"title":"show-card","made_by":"gayane-gasparyan","html":"\n\u003cdiv class=\"card\"\u003e\n  \u003cdiv class=\"wrapper\"\u003e\n    \u003cimg\n      src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-cover.jpg\"\n      class=\"cover-image\"\n    /\u003e\n  \u003c/div\u003e\n  \u003cimg\n    src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-title.png\"\n    class=\"title\"\n  /\u003e\n  \u003cimg\n    src=\"https://ggayane.github.io/css-experiments/cards/dark_rider-character.webp\"\n    class=\"character\"\n  /\u003e\n\u003c/div\u003e\n","css":"\n.card {\n  --card-height: 200px;\n  --card-width: calc(var(--card-height) / 1.5);\n  width: var(--card-width);\n  height: var(--card-height);\n  position: relative;\n  display: flex;\n  justify-content: center;\n  align-items: flex-end;\n  padding: 0 36px;\n  perspective: 2500px;\n  margin: 0 50px;\n}\n\n.cover-image {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.wrapper {\n  transition: all 0.5s;\n  position: absolute;\n  width: 100%;\n  z-index: -1;\n}\n\n.card:hover .wrapper {\n  transform: perspective(900px) translateY(-5%) rotateX(25deg) translateZ(0);\n  box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n  -webkit-box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n  -moz-box-shadow: 2px 35px 32px -8px rgba(0, 0, 0, 0.75);\n}\n\n.wrapper::before,\n.wrapper::after {\n  content: '';\n  opacity: 0;\n  width: 100%;\n  height: 80px;\n  transition: all 0.5s;\n  position: absolute;\n  left: 0;\n}\n.wrapper::before {\n  top: 0;\n  height: 100%;\n  background-image: linear-gradient(\n    to top,\n    transparent 46%,\n    rgba(12, 13, 19, 0.5) 68%,\n    rgba(12, 13, 19) 97%\n  );\n}\n.wrapper::after {\n  bottom: 0;\n  opacity: 1;\n  background-image: linear-gradient(\n    to bottom,\n    transparent 46%,\n    rgba(12, 13, 19, 0.5) 68%,\n    rgba(12, 13, 19) 97%\n  );\n}\n\n.card:hover .wrapper::before,\n.wrapper::after {\n  opacity: 1;\n}\n\n.card:hover .wrapper::after {\n  height: 120px;\n}\n.title {\n  width: 100%;\n  transition: transform 0.5s;\n}\n.card:hover .title {\n  transform: translate3d(0%, -50px, 100px);\n}\n\n.character {\n  width: 100%;\n  opacity: 0;\n  transition: all 0.5s;\n  position: absolute;\n  z-index: -1;\n}\n\n.card:hover .character {\n  opacity: 1;\n  transform: translate3d(0%, -30%, 100px);\n}\n","type":"others","slug":"show-card"},{"title":"pokeball","made_by":"andreasnylin","html":"\n\u003cdiv class=\"ball\"\u003e\n  \u003cdiv class=\"top\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"mid\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"bottom\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"btn\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.ball {\n  --ball-size: 188px;\n  --btn-size: calc(var(--ball-size) * .38);\n  --stripe-height: calc(var(--ball-size) * .06);\n  --shadow-width: calc(var(--ball-size) / 10);\n  --shadow-color: rgba(0,0,0,.075);\n  --bg-color: #2196f3;\n  --bg-color2: #0b77cd;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  width: var(--ball-size);\n  height: var(--ball-size);\n  border-radius: 50%;\n}\n\n.top {\n  height: calc(var(--ball-size) / 2 - (var(--stripe-height) / 2));\n  border-top-left-radius: 50% 100%;\n  border-top-right-radius: 50% 100%;\n  background: red;\n  box-shadow: var(--shadow-width) 0 0 var(--shadow-color) inset;\n}\n\n.top::after {\n  content: '';\n  position: absolute;\n  top: calc(11%);\n  left: calc(61%);\n  width: calc(var(--ball-size) * .3);\n  height: calc(var(--ball-size) * .17);\n  border-radius: 50%;\n  background-color: rgba(255,255,255,.7);\n  transform: rotate(40deg);\n}\n\n.mid {\n  align-self: center;\n  height: var(--stripe-height);\n  width: calc(var(--ball-size) * .96);\n  100%;\n  background: black;\n}\n\n.bottom {\n  height: calc(var(--ball-size) / 2 - (var(--stripe-height) / 2));\n  border-bottom-left-radius: 50% 100%;\n  border-bottom-right-radius: 50% 100%;\n  background: white;\n  box-shadow: var(--shadow-width) calc(var(--shadow-width) * -.2) 0 var(--shadow-color) inset;\n}\n\n.bottom::after {\n  content: '';\n  position: absolute;\n  top: calc(50% + var(--ball-size) / 2.25);\n  left: calc(50% - var(--ball-size) / 2.1);\n  width: calc(var(--ball-size) * .8);\n  height: calc(var(--ball-size) * .1);\n  border-radius: 50%;\n  background-color: rgba(0,0,0,.075);\n  z-index: -1;\n}\n\n.btn {\n  position: absolute;\n  top: calc(50% - var(--btn-size) / 2);\n  left: calc(50% - var(--btn-size) / 2);\n  width: var(--btn-size);\n  height: var(--btn-size);\n  border-radius: 50%;\n  background: white;\n  border: solid var(--stripe-height) black;\n  box-shadow: 1px 0px 0px black inset;\n}\n\n.btn:after {\n  --size: calc(var(--btn-size) * .45);\n  content: '';\n  position: absolute;\n  top: calc(50% - var(--size) / 2);\n  left: calc(50% - var(--size) / 2);\n  width: var(--size);\n  height: var(--size);\n  border-radius: 50%;\n  background: white;\n  border: solid 2px #666;\n}\n","type":"others","slug":"pokeball"},{"title":"orange-monkey-2","made_by":"demchenk0","theme":"dark","html":"\n\u003cdiv class=\"pyramid-loader\"\u003e\n  \u003cdiv class=\"wrapper\"\u003e\n    \u003cspan class=\"side side1\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side2\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side3\"\u003e\u003c/span\u003e\n    \u003cspan class=\"side side4\"\u003e\u003c/span\u003e\n    \u003cspan class=\"shadow\"\u003e\u003c/span\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","css":"\n.pyramid-loader {\n  position: relative;\n  width: 300px;\n  height: 300px;\n  display: block;\n  transform-style: preserve-3d;\n  transform: rotateX(-20deg);\n}\n\n.wrapper {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  transform-style: preserve-3d;\n  animation: spin 4s linear infinite;\n}\n\n@keyframes spin {\n  100% {\n    transform: rotateY(360deg);\n  }\n}\n\n.pyramid-loader .wrapper .side {\n  width: 70px;\n  height: 70px;\n  /* you can choose any gradient or color you want */\n  /* background: radial-gradient( #2F2585 10%, #F028FD 70%, #2BDEAC 120%); */\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  margin: auto;\n  transform-origin: center top;\n  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);\n}\n\n.pyramid-loader .wrapper .side1 {\n  transform: rotateZ(-30deg) rotateY(90deg);\n  background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);\n}\n\n.pyramid-loader .wrapper .side2 {\n  transform: rotateZ(30deg) rotateY(90deg);\n  background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);\n}\n\n.pyramid-loader .wrapper .side3 {\n  transform: rotateX(30deg);\n  background: conic-gradient(#2f2585, #d8cce6, #f028fd, #2bdeac);\n}\n\n.pyramid-loader .wrapper .side4 {\n  transform: rotateX(-30deg);\n  background: conic-gradient(#2bdeac, #f028fd, #d8cce6, #2f2585);\n}\n\n.pyramid-loader .wrapper .shadow {\n  width: 60px;\n  height: 60px;\n  background: #8b5ad5;\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  margin: auto;\n  transform: rotateX(90deg) translateZ(-40px);\n  filter: blur(12px);\n}\n","type":"others","slug":"orange-monkey-2"},{"title":"new-deer-97","made_by":"JkHuger","theme":"dark","html":"\n\u003cdiv class=\"box-of-star1\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position2\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position3\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position4\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position5\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position6\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"star star-position7\"\u003e\u003c/div\u003e\n\u003c/div\u003e\n\u003cdiv class=\"box-of-star2\"\u003e\n  \u003cdiv class=\"star star-position1\"\u003 \n  0% {\n    opacity: 0;\n    transform: translateY(0px);\n  }\n\n  20% {\n    opacity: 1;\n  }\n\n  100% {\n    opacity: 1;\n    transform: translateY(650px);\n  }\n}\n\n@keyframes astronaut {\n  0% {\n    transform: rotate(0deg);\n  }\n\n  100% {\n    transform: rotate(360deg);\n  }\n}\n\n.box-of-star1,\n.box-of-star2,\n.box-of-star3,\n.box-of-star4 {\n  width: 100%;\n  position: absolute;\n  z-index: 10;\n  left: 0;\n  transform: translateY(650px);\n  height: 700px;\n}\n\n.box-of-star1 {\n  animation: snow 5s linear infinite;\n}\n\n.box-of-star2 {\n  animation: snow 5s -1.64s linear infinite;\n}\n\n.box-of-star3 {\n  animation: snow 5s -2.3s linear infinite;\n}\n\n.box-of-star4 {\n  animation: snow 5s -3.3s linear infinite;\n}\n\n.star {\n  width: 3px;\n  height: 3px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  opacity: 0.7;\n}\n\n.star:before {\n  content: '';\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  top: 80px;\n  left: 70px;\n  opacity: 0.7;\n}\n\n.star:after {\n  content: '';\n  width: 8px;\n  height: 8px;\n  border-radius: 50%;\n  background-color: #fff;\n  position: absolute;\n  z-index: 10;\n  top: 8px;\n  left: 170px;\n  opacity: 0.9;\n}\n\n.star-position1 {\n  top: 30px;\n  left: 20px;\n}\n\n.star-position2 {\n  top: 110px;\n  left: 250px;\n}\n\n.star-position3 {\n  top: 60px;\n  left: 570px;\n}\n\n.star-position4 {\n  top: 120px;\n  left: 900px;\n}\n\n.star-position5 {\n  top: 20px;\n  left: 1120px;\n}\n\n.star-position6 {\n  top: 90px;\n  left: 1280px;\n}\n\n.star-position7 {\n  top: 30px;\n  left: 1480px;\n}\n\n.astronaut {\n  width: 250px;\n  height: 300px;\n  position: absolute;\n  z-index: 11;\n  top: calc(50% - 150px);\n  left: calc(50% - 125px);\n  animation: astronaut 5s linear infinite;\n}\n\n.schoolbag {\n  width: 100px;\n  height: 150px;\n  position: absolute;\n  z-index: 1;\n  top: calc(50% - 75px);\n  left: calc(
